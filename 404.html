<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/home.css">

<body class="home">
<script src="js/icons.js"></script>
<div id="bg"></div>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="grid-floor" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main id="main" class="gate">
  <section class="hero">
    <span class="badge badge-pink">ERROR 404</span>
    <h1 class="glitch" data-text="GAME OVER" style="margin-top:22px">GAME&nbsp;OVER</h1>
    <p class="tagline">Esta página no existe o cambió de lugar.</p>
    <p class="gate__prompt">&gt; CONTINUE? ELIGE UN CHECKPOINT</p>
    <nav class="doors" aria-label="Elige una experiencia">
      <a class="door" href="landing.html" aria-label="Comunidad: mis redes, lo que construyo y mi biografía">
        <span class="door__kicker">PLAYER 1 · SEGUIDORES</span>
        <span class="icon-tile door__icon" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-gamepad"/></svg></span>
        <span class="door__title">COMUNIDAD</span>
        <ul class="door__list"><li><svg class="i" aria-hidden="true"><use href="#i-link"/></svg>Mis redes</li><li><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>Lo que construyo</li><li><svg class="i" aria-hidden="true"><use href="#i-user"/></svg>Mi biografía</li></ul>
        <span class="door__go">ENTRAR <svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
      </a>
      <a class="door" href="studio/index.html" aria-label="Nayer Studio: servicios, cotizaciones y contacto">
        <span class="door__kicker">PLAYER 2 · CLIENTES</span>
        <span class="icon-tile door__icon" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-briefcase"/></svg></span>
        <span class="door__title">NAYER STUDIO</span>
        <ul class="door__list"><li><svg class="i" aria-hidden="true"><use href="#i-code"/></svg>Servicios</li><li><svg class="i" aria-hidden="true"><use href="#i-calculator"/></svg>Cotizaciones</li><li><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>Contacto</li></ul>
        <span class="door__go">ENTRAR <svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
      </a>
    </nav>
  </section>
</main>

<script src="js/background.js"></script>
<script src="js/effects.js"></script>
<script src="js/ui.js"></script>
